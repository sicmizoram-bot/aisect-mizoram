<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AISECT Mizoram AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6f8;
            color: #243447;
        }

        .landing {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .brand {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 56px;
            margin: 0 0 20px;
        }

        .description {
            font-size: 22px;
            max-width: 700px;
            line-height: 1.5;
            margin-bottom: 40px;
        }

        .chat-button {
            background: #214e63;
            color: white;
            border: none;
            padding: 22px 45px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
        }

        .chat-button:hover {
            background: #163b4d;
        }

        /* Chatbot */

        .chatbox {
            display: none;
            position: fixed;
            right: 30px;
            bottom: 30px;
            width: 400px;
            height: 600px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            flex-direction: column;
        }

        .chat-header {
            background: #214e63;
            color: white;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            cursor: pointer;
            font-size: 24px;
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .bot-message {
            background: #eef2f5;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            max-width: 85%;
            text-align: left;
            line-height: 1.4;
        }

        .user-message {
            background: #214e63;
            color: white;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            margin-left: auto;
            max-width: 85%;
            text-align: left;
            line-height: 1.4;
        }

        /* Category buttons */

        .category-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .category-button {
            background: #214e63;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
        }

        .category-button:hover {
            background: #163b4d;
        }

        .selected-category {
            font-size: 13px;
            padding: 8px 12px;
            background: #eef2f5;
            border-bottom: 1px solid #ddd;
            color: #214e63;
            display: none;
        }

        .change-category {
            float: right;
            cursor: pointer;
            font-weight: bold;
        }

        .chat-input {
            display: flex;
            border-top: 1px solid #ddd;
        }

        .chat-input input {
            flex: 1;
            border: none;
            padding: 18px;
            font-size: 16px;
            outline: none;
        }

        .chat-input button {
            background: #214e63;
            color: white;
            border: none;
            padding: 0 22px;
            cursor: pointer;
        }

        .chat-input button:hover {
            background: #163b4d;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 38px;
            }

            .description {
                font-size: 18px;
            }

            .chatbox {
                width: 90%;
                height: 80vh;
                right: 5%;
                bottom: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="landing">

        <div class="brand">
            AISECT Mizoram
        </div>

        <h1>Your AI Education Assistant</h1>

        <div class="description">
            Ask about Online UG & PG programmes, B.Ed, PhD,
            admissions and more.
        </div>

        <button class="chat-button" onclick="openChat()">
            Chat with AISECT Mizoram AI
        </button>

    </div>


    <div class="chatbox" id="chatbox">

        <div class="chat-header">

            AISECT Mizoram AI

            <span class="close-btn" onclick="closeChat()">
                ×
            </span>

        </div>

        <div class="selected-category" id="selectedCategory">
            <span id="categoryName"></span>
            <span class="change-category" onclick="showCategories()">
                Change
            </span>
        </div>


        <div class="messages" id="messages">

            <div class="bot-message" id="welcomeMessage">
                Hello! I am the AISECT Mizoram AI Assistant.
                <br><br>
                Please select the information you are looking for:

                <div class="category-buttons" id="categoryButtons">

                    <button
                        class="category-button"
                        onclick="selectCategory('ug_pg', 'Online UG/PG')"
                    >
                        Online UG/PG
                    </button>

                    <button
                        class="category-button"
                        onclick="selectCategory('bed_phd', 'B.Ed / PhD')"
                    >
                        B.Ed / PhD
                    </button>

                </div>

            </div>

        </div>


        <div class="chat-input">

            <input
                type="text"
                id="userInput"
                placeholder="Select a category first..."
                disabled
                onkeypress="if(event.key === 'Enter') sendMessage()"
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>


    <script>

        const WORKER_URL =
            "https://aisect-rag.sicmizoram.workers.dev";

        let selectedCategory = null;


        function openChat() {

            document.getElementById("chatbox").style.display = "flex";

            if (selectedCategory) {
                document.getElementById("userInput").focus();
            }
        }


        function closeChat() {
            document.getElementById("chatbox").style.display = "none";
        }


        function selectCategory(category, name) {

            selectedCategory = category;

            document.getElementById("categoryName").textContent =
                "Selected: " + name;

            document.getElementById("selectedCategory").style.display =
                "block";

            const buttons =
                document.getElementById("categoryButtons");

            if (buttons) {
                buttons.style.display = "none";
            }

            const welcome =
                document.getElementById("welcomeMessage");

            welcome.innerHTML = `
                You selected <strong>${name}</strong>.
                <br><br>
                Please ask your question.
            `;

            const input =
                document.getElementById("userInput");

            input.disabled = false;
            input.placeholder = "Type your question...";
            input.focus();
        }


        function showCategories() {

            selectedCategory = null;

            document.getElementById("selectedCategory").style.display =
                "none";

            const messages =
                document.getElementById("messages");

            messages.innerHTML = `
                <div class="bot-message" id="welcomeMessage">
                    Hello! I am the AISECT Mizoram AI Assistant.
                    <br><br>
                    Please select the information you are looking for:

                    <div class="category-buttons" id="categoryButtons">

                        <button
                            class="category-button"
                            onclick="selectCategory('ug_pg', 'Online UG/PG')"
                        >
                            Online UG/PG
                        </button>

                        <button
                            class="category-button"
                            onclick="selectCategory('bed_phd', 'B.Ed / PhD')"
                        >
                            B.Ed / PhD
                        </button>

                    </div>
                </div>
            `;

            const input =
                document.getElementById("userInput");

            input.disabled = true;
            input.placeholder = "Select a category first...";
        }


        async function sendMessage() {

            if (!selectedCategory) {
                return;
            }

            const input =
                document.getElementById("userInput");

            const message =
                input.value.trim();

            if (message === "") return;


            const messages =
                document.getElementById("messages");


            const userMessage =
                document.createElement("div");

            userMessage.className =
                "user-message";

            userMessage.textContent =
                message;

            messages.appendChild(userMessage);


            input.value = "";
            input.disabled = true;


            const loadingMessage =
                document.createElement("div");

            loadingMessage.className =
                "bot-message";

            loadingMessage.textContent =
                "Thinking...";

            messages.appendChild(loadingMessage);

            messages.scrollTop =
                messages.scrollHeight;


            try {

                const response =
                    await fetch(WORKER_URL, {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: message,
                            category: selectedCategory
                        })

                    });


                const data =
                    await response.json();


                loadingMessage.remove();


                const botMessage =
                    document.createElement("div");

                botMessage.className =
                    "bot-message";


                if (data.reply) {

                    botMessage.textContent =
                        data.reply;

                } else {

                    botMessage.textContent =
                        "Sorry, I could not process your request.";

                }


                messages.appendChild(botMessage);


            } catch (error) {

                loadingMessage.remove();


                const errorMessage =
                    document.createElement("div");

                errorMessage.className =
                    "bot-message";

                errorMessage.textContent =
                    "Sorry, I am unable to connect right now.";

                messages.appendChild(errorMessage);

            }


            input.disabled = false;
            input.focus();

            messages.scrollTop =
                messages.scrollHeight;

        }

    </script>

</body>

</html>
