<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AISECT Mizoram</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f4f8fb, #e8f1f5);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1d2b38;
    }

    .container {
      text-align: center;
      padding: 30px;
      max-width: 750px;
    }

    .logo {
      font-size: 32px;
      font-weight: 700;
      color: #17445b;
      margin-bottom: 35px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .subtitle {
      font-size: 20px;
      line-height: 1.6;
      color: #5d6973;
      margin-bottom: 40px;
    }

    .chat-button {
      background: #17445b;
      color: white;
      border: none;
      padding: 18px 30px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 8px 20px rgba(23, 68, 91, 0.2);
    }

    .chat-button:hover {
      background: #0e3448;
      transform: translateY(-2px);
    }

    .chat-icon {
      font-size: 22px;
      margin-right: 10px;
    }

    /* Chatbot Window */
    .chatbot {
      display: none;
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 380px;
      height: 550px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.2);
      overflow: hidden;
      z-index: 1000;
      flex-direction: column;
    }

    .chat-header {
      background: #17445b;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }

    .close {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .chat-body {
      flex: 1;
      padding: 20px;
      background: #f7f9fa;
      overflow-y: auto;
    }

    .message {
      background: white;
      padding: 14px;
      border-radius: 12px;
      max-width: 85%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      line-height: 1.5;
    }

    .chat-input {
      display: flex;
      padding: 15px;
      border-top: 1px solid #eee;
      gap: 10px;
    }

    .chat-input input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
    }

    .send-button {
      background: #17445b;
      color: white;
      border: none;
      padding: 0 18px;
      border-radius: 10px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 36px;
      }

      .chatbot {
        width: calc(100% - 30px);
        right: 15px;
        bottom: 15px;
        height: 75vh;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">AISECT Mizoram</div>

    <h1>Your AI Education Assistant</h1>

    <p class="subtitle">
      Ask about Online UG & PG programmes, Skill Development courses,
      admissions and more.
    </p>

    <button class="chat-button" onclick="openChat()">
      <span class="chat-icon">💬</span>
      Chat with AISECT Mizoram AI
    </button>

  </div>


  <!-- Chatbot -->

  <div class="chatbot" id="chatbot">

    <div class="chat-header">
      <span>AISECT Mizoram AI</span>

      <button class="close" onclick="closeChat()">×</button>
    </div>

    <div class="chat-body">

      <div class="message">
        Hello! I am the AISECT Mizoram AI Assistant.<br><br>
        How can I help you today?
      </div>

    </div>

    <div class="chat-input">

      <input
        type="text"
        id="messageInput"
        placeholder="Type your message..."
      >

      <button class="send-button">
        Send
      </button>

    </div>

  </div>


  <script>

    function openChat() {
      document.getElementById("chatbot").style.display = "flex";
    }

    function closeChat() {
      document.getElementById("chatbot").style.display = "none";
    }

  </script>

</body>
</html>
