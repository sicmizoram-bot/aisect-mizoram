<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AISECT Mizoram AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6f8;
            color: #243447;
        }

        .landing {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .brand {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 56px;
            margin: 0 0 20px;
        }

        .description {
            font-size: 22px;
            max-width: 700px;
            line-height: 1.5;
            margin-bottom: 40px;
        }

        .chat-button {
            background: #214e63;
            color: white;
            border: none;
            padding: 22px 45px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
        }

        .chat-button:hover {
            background: #163b4d;
        }

        /* Chatbot */

        .chatbox {
            display: none;
            position: fixed;
            right: 30px;
            bottom: 30px;
            width: 400px;
            height: 550px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            flex-direction: column;
        }

        .chat-header {
            background: #214e63;
            color: white;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            cursor: pointer;
            font-size: 24px;
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .bot-message {
            background: #eef2f5;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            max-width: 85%;
            text-align: left;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user-message {
            background: #214e63;
            color: white;
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            margin-left: auto;
            max-width: 85%;
            text-align: left;
            line-height: 1.5;
        }

        /* Suggested questions */

        .suggestions {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 18px;
        }

        .suggestion-btn {
            background: white;
            color: #214e63;
            border: 1px solid #214e63;
            padding: 9px 13px;
            border-radius: 16px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            max-width: 100%;
        }

        .suggestion-btn:hover {
            background: #214e63;
            color: white;
        }

        .chat-input {
            display: flex;
            border-top: 1px solid #ddd;
        }

        .chat-input input {
            flex: 1;
            border: none;
            padding: 18px;
            font-size: 16px;
            outline: none;
        }

        .chat-input button {
            background: #214e63;
            color: white;
            border: none;
            padding: 0 22px;
            cursor: pointer;
        }

        .chat-input button:hover {
            background: #163b4d;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 38px;
            }

            .description {
                font-size: 18px;
            }

            .chatbox {
                width: 90%;
                right: 5%;
                bottom: 20px;
                height: 80vh;
            }
        }
    </style>
</head>

<body>

    <div class="landing">

        <div class="brand">
            AISECT Mizoram
        </div>

        <h1>Your AI Education Assistant</h1>

        <div class="description">
            Ask about Online UG & PG programmes, B.Ed, PhD,
            admissions and more.
        </div>

        <button class="chat-button" onclick="openChat()">
            Chat with AISECT Mizoram AI
        </button>

    </div>


    <div class="chatbox" id="chatbox">

        <div class="chat-header">

            AISECT Mizoram AI

            <span class="close-btn" onclick="closeChat()">
                ×
            </span>

        </div>


        <div class="messages" id="messages">

            <div class="bot-message">
                Hello! I am the AISECT Mizoram AI Assistant.

                You can ask me about Online UG & PG programmes,
                B.Ed, PhD, admissions and more.
            </div>

        </div>


        <div class="chat-input">

            <input
                type="text"
                id="userInput"
                placeholder="Type your question..."
                onkeypress="if(event.key === 'Enter') sendMessage()"
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>


    <script>

        const WORKER_URL =
            "https://aisect-rag.sicmizoram.workers.dev";


        function openChat() {
            document.getElementById("chatbox").style.display = "flex";
            document.getElementById("userInput").focus();
        }


        function closeChat() {
            document.getElementById("chatbox").style.display = "none";
        }


        async function sendMessage(suggestedMessage = null) {

            const input =
                document.getElementById("userInput");

            const message =
                suggestedMessage || input.value.trim();


            if (message === "") return;


            const messages =
                document.getElementById("messages");


            /* Show user message */

            const userMessage =
                document.createElement("div");

            userMessage.className =
                "user-message";

            userMessage.textContent =
                message;

            messages.appendChild(userMessage);


            input.value = "";
            input.disabled = true;


            messages.scrollTop =
                messages.scrollHeight;


            /* Show loading message */

            const loadingMessage =
                document.createElement("div");

            loadingMessage.className =
                "bot-message";

            loadingMessage.textContent =
                "Thinking...";

            messages.appendChild(
                loadingMessage
            );


            messages.scrollTop =
                messages.scrollHeight;


            try {

                const response =
                    await fetch(WORKER_URL, {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message: message
                        })

                    });


                const data =
                    await response.json();


                loadingMessage.remove();


                /* Show AI reply */

                const botMessage =
                    document.createElement("div");

                botMessage.className =
                    "bot-message";


                if (data.reply) {

                    botMessage.textContent =
                        data.reply;

                } else {

                    botMessage.textContent =
                        "Sorry, I could not process your request.";

                }


                messages.appendChild(
                    botMessage
                );


                /* Show related questions */

                if (
                    data.suggestions &&
                    Array.isArray(data.suggestions) &&
                    data.suggestions.length > 0
                ) {

                    const suggestionsContainer =
                        document.createElement("div");

                    suggestionsContainer.className =
                        "suggestions";


                    data.suggestions.forEach(
                        function(question) {

                            const button =
                                document.createElement("button");

                            button.className =
                                "suggestion-btn";

                            button.textContent =
                                question;


                            button.onclick =
                                function() {

                                    /* Remove all old suggestions */

                                    const oldSuggestions =
                                        document.querySelectorAll(
                                            ".suggestions"
                                        );

                                    oldSuggestions.forEach(
                                        function(item) {
                                            item.remove();
                                        }
                                    );


                                    /* Send selected question */

                                    sendMessage(question);

                                };


                            suggestionsContainer.appendChild(
                                button
                            );

                        }
                    );


                    messages.appendChild(
                        suggestionsContainer
                    );

                }


            } catch (error) {

                loadingMessage.remove();


                const errorMessage =
                    document.createElement("div");

                errorMessage.className =
                    "bot-message";

                errorMessage.textContent =
                    "Sorry, I am unable to connect right now.";


                messages.appendChild(
                    errorMessage
                );

            }


            input.disabled = false;
            input.focus();


            messages.scrollTop =
                messages.scrollHeight;

        }

    </script>

</body>

</html>
