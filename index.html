<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AISECT Mizoram AI</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f3f6f8;
        color: #243447;
    }

    .landing {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
    }

    .brand {
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 40px;
    }

    h1 {
        font-size: 56px;
        margin: 0 0 20px;
    }

    .description {
        font-size: 22px;
        max-width: 700px;
        line-height: 1.5;
        margin-bottom: 40px;
    }

    .chat-button {
        background: #214e63;
        color: white;
        border: none;
        padding: 22px 45px;
        font-size: 20px;
        font-weight: bold;
        border-radius: 15px;
        cursor: pointer;
    }

    .chat-button:hover {
        background: #163b4d;
    }

    /* Chatbot */
    .chatbox {
        display: none;
        position: fixed;
        right: 30px;
        bottom: 30px;
        width: 400px;
        height: 550px;
        background: white;
        border-radius: 18px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        overflow: hidden;
        flex-direction: column;
    }

    .chat-header {
        background: #214e63;
        color: white;
        padding: 18px;
        font-size: 18px;
        font-weight: bold;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .close-btn {
        cursor: pointer;
        font-size: 24px;
    }

    .messages {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
    }

    .bot-message {
        background: #eef2f5;
        padding: 12px 15px;
        border-radius: 12px;
        margin-bottom: 15px;
        max-width: 85%;
        text-align: left;
    }

    .chat-input {
        display: flex;
        border-top: 1px solid #ddd;
    }

    .chat-input input {
        flex: 1;
        border: none;
        padding: 18px;
        font-size: 16px;
        outline: none;
    }

    .chat-input button {
        background: #214e63;
        color: white;
        border: none;
        padding: 0 22px;
        cursor: pointer;
    }

    @media (max-width: 600px) {
        h1 {
            font-size: 38px;
        }

        .chatbox {
            width: 90%;
            right: 5%;
            bottom: 20px;
        }
    }
</style>
</head>

<body>

<div class="landing">

    <div class="brand">AISECT Mizoram</div>

    <h1>Your AI Education Assistant</h1>

    <div class="description">
        Ask about Online UG & PG programmes, Skill Development courses,
        admissions and more.
    </div>

    <button class="chat-button" onclick="openChat()">
        💬 Chat with AISECT Mizoram AI
    </button>

</div>


<div class="chatbox" id="chatbox">

    <div class="chat-header">
        AISECT Mizoram AI
        <span class="close-btn" onclick="closeChat()">×</span>
    </div>

    <div class="messages" id="messages">

        <div class="bot-message">
            Hello! I am the AISECT Mizoram AI Assistant.<br><br>
            You can ask me about Online UG & PG programmes, Skill Development courses, admissions and more.
        </div>

    </div>

    <div class="chat-input">

        <input
            type="text"
            id="userInput"
            placeholder="Type your question..."
            onkeypress="if(event.key==='Enter') sendMessage()"
        >

        <button onclick="sendMessage()">Send</button>

    </div>

</div>


<script>

function openChat() {
    document.getElementById("chatbox").style.display = "flex";
}

function closeChat() {
    document.getElementById("chatbox").style.display = "none";
}

const WORKER_URL = "https://aisect-mizoram-ai.sicmizoram.workers.dev/";

function openChat() {
    document.getElementById("chatbox").style.display = "flex";
}

function closeChat() {
    document.getElementById("chatbox").style.display = "none";
}

async function sendMessage() {

    const input = document.getElementById("userInput");
    const message = input.value.trim();

    if (message === "") return;

    const messages = document.getElementById("messages");

    // Show user message
    const userMessage = document.createElement("div");

    userMessage.style.background = "#214e63";
    userMessage.style.color = "white";
    userMessage.style.padding = "12px 15px";
    userMessage.style.borderRadius = "12px";
    userMessage.style.marginBottom = "15px";
    userMessage.style.marginLeft = "auto";
    userMessage.style.maxWidth = "85%";
    userMessage.style.textAlign = "left";

    userMessage.textContent = message;

    messages.appendChild(userMessage);

    input.value = "";
    messages.scrollTop = messages.scrollHeight;

    // Show loading message
    const loadingMessage = document.createElement("div");

    loadingMessage.className = "bot-message";
    loadingMessage.textContent = "Typing...";

    messages.appendChild(loadingMessage);
    messages.scrollTop = messages.scrollHeight;

    try {

        const response = await fetch(
            "https://aisect-rag.sicmizoram.workers.dev",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: message
                })
            }
        );

        const data = await response.json();

        // Remove typing message
        loadingMessage.remove();

        // Show AI reply
        const botMessage = document.createElement("div");

        botMessage.className = "bot-message";

        botMessage.textContent =
            data.reply || "Sorry, something went wrong.";

        messages.appendChild(botMessage);

    } catch (error) {

        loadingMessage.remove();

        const errorMessage = document.createElement("div");

        errorMessage.className = "bot-message";

        errorMessage.textContent =
            "Sorry, I am unable to connect right now.";

        messages.appendChild(errorMessage);
    }

    messages.scrollTop = messages.scrollHeight;
}

    const input = document.getElementById("userInput");
    const message = input.value.trim();

    if (message === "") return;

    const messages = document.getElementById("messages");

    // Show user message
    const userMessage = document.createElement("div");

    userMessage.style.background = "#214e63";
    userMessage.style.color = "white";
    userMessage.style.padding = "12px 15px";
    userMessage.style.borderRadius = "12px";
    userMessage.style.marginBottom = "15px";
    userMessage.style.marginLeft = "auto";
    userMessage.style.maxWidth = "85%";
    userMessage.style.textAlign = "left";

    userMessage.textContent = message;
    messages.appendChild(userMessage);

    input.value = "";
    input.disabled = true;

    // Show thinking message
    const thinking = document.createElement("div");
    thinking.className = "bot-message";
    thinking.textContent = "Thinking...";
    messages.appendChild(thinking);

    messages.scrollTop = messages.scrollHeight;

    try {
        const response = await fetch(WORKER_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message
            })
        });

        const data = await response.json();

        thinking.remove();

        const botMessage = document.createElement("div");
        botMessage.className = "bot-message";

        if (data.reply) {
            botMessage.textContent = data.reply;
        } else {
            botMessage.textContent =
                "Sorry, I could not process your request. Please try again.";
        }

        messages.appendChild(botMessage);

    } catch (error) {

        thinking.remove();

        const errorMessage = document.createElement("div");
        errorMessage.className = "bot-message";
        errorMessage.textContent =
            "Connection error. Please try again.";

        messages.appendChild(errorMessage);
    }

    input.disabled = false;
    input.focus();

    messages.scrollTop = messages.scrollHeight;
}

</script>

</body>
</html>
